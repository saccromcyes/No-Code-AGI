version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=sqlite:///./openagi.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - openagi_db:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  openagi_db:

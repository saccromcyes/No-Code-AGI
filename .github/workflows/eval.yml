name: Evaluate

# Runs the starter agents on eval/tasks.jsonl with the real model and real tools (Wikipedia, etc.)
# and publishes eval/results/latest.json (shown on the live Evaluation tab) and the README table.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  push:
    branches: [main]
    paths: ["agentkit/**", "eval/tasks.jsonl"]

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
      LLM_MAX_RETRIES: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run evaluation
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::warning::LLM_API_KEY secret not set; skipping the agent evaluation"
            exit 0
          fi
          python -m eval.run_eval
      - name: Commit results
        if: env.LLM_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results README.md
          git diff --cached --quiet || git commit -m "eval: refresh agent results"
          git push

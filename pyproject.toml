[project]
name = "no-code-agent-builder"
version = "2.0.0"
description = "Build tool-using AI agents without code and inspect every step they take."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
